[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Explicit so a Ruff upgrade cannot silently change what CI enforces.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.vercel]
entrypoint = "backend.app:app"

[project]
name = "wind-replay"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0"]
