name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m pytest -q
      - run: python scripts/audit.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t wind-replay .
      - run: |
          docker run -d --name wind-replay -p 8000:8000 wind-replay
          for i in $(seq 1 30); do curl -f http://localhost:8000/api/health && break || sleep 1; done
          curl -f http://localhost:8000/api/replay
